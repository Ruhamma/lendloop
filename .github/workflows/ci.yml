name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check app convex e2e proxy.ts scripts

      - name: Type-check
        # Next.js generates route/layout types (LayoutProps etc.) during dev or build;
        # typegen creates them on their own so tsc can run before the build.
        run: npx next typegen && npx tsc --noEmit

      - name: Unit + Convex function tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only; no real deployment or keys are used in CI.
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high --omit=dev
